<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Đăng nhập - WBS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .auth-box {
      background: #fff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 30px;
      font-size: 28px;
      color: #333;
      font-weight: 600;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #666;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      padding-right: 40px;
      /* Add space for toggle */
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
      background-color: #f0f4f9;
      font-size: 15px;
    }

    .password-container {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-size: 16px;
      /* Slightly smaller for icons */
      color: #777;
      line-height: 1;
      display: flex;
      align-items: center;
    }

    .btn-auth {
      width: 100%;
      padding: 14px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      margin-top: 10px;
    }

    .btn-auth:hover {
      background: #333;
    }

    .footer {
      margin-top: 25px;
      font-size: 14px;
      color: #333;
    }

    .footer a {
      color: #000;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="auth-box">
    <h2>Đăng nhập</h2>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email hoặc số điện thoại</label>
        <input type="text" id="email" required />
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <div class="password-container">
          <input type="password" id="password" required />
          <button type="button" class="toggle-password" onclick="togglePassword()">
            <i class="fa-solid fa-eye" id="toggleIcon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-auth">Đăng nhập</button>
    </form>
    <div class="footer">
      Bạn chưa có tài khoản? <a href="register.html">Đăng ký</a>
    </div>
  </div>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggleIcon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const submitBtn = document.querySelector('.btn-auth');
      submitBtn.textContent = 'Đang xử lý...';
      submitBtn.disabled = true;

      try {
        const response = await fetch('http://localhost:3000/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (response.ok && data.success) {
          localStorage.setItem('currentUser', JSON.stringify(data.user));
          window.location.href = data.user.role == 1 ? 'dashboard.html' : 'index.html';
        } else {
          alert(data.message || 'Lỗi đăng nhập');
        }
      } catch (error) {
        alert('Lỗi kết nối server');
      } finally {
        submitBtn.textContent = 'Đăng nhập';
        submitBtn.disabled = false;
      }
    }
  </script>
</body>

</html>
